<section class="ns-page auth">
  <div class="ns-panel auth__panel">
    <span class="ns-page__badge">{{ 'nav.signIn' | translate }}</span>
    <h1 class="ns-page__title">{{ 'iam.signIn.title' | translate }}</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="auth__field">
        <mat-label>{{ 'iam.signIn.username' | translate }}</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="auth__field">
        <mat-label>{{ 'iam.signIn.password' | translate }}</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
      </mat-form-field>

      @if (iamStore.error(); as errorKey) {
        <p class="ns-error" role="alert">{{ errorKey | translate }}</p>
      }

      <button class="ns-button ns-button--primary auth__submit" type="submit" [disabled]="iamStore.loading()">
        {{ 'iam.signIn.submit' | translate }}
        <span aria-hidden="true">&rarr;</span>
      </button>
    </form>

    <p class="auth__hint">
      {{ 'iam.signIn.noAccount' | translate }}
      <a routerLink="/sign-up">{{ 'nav.signUp' | translate }}</a>
    </p>
  </div>
</section>
