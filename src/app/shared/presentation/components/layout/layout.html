<div class="app-layout">

  <aside class="app-sidebar">

    <!-- LOGO -->
    <div class="app-sidebar__logo">
      <img
        src="assets/logos/logo-principal.png"
        alt="NodeSecure"
      />
    </div>

    <!-- USER -->
    <div class="app-sidebar__user">
      <div class="app-sidebar__avatar">
        AU
      </div>

      <span>A. Usuario</span>
    </div>

    <!-- MENU -->
    <nav class="app-sidebar__menu">

      <!-- WAREHOUSES -->
      <a
        routerLink="/warehouses"
        routerLinkActive="app-sidebar__item--active"
        class="app-sidebar__item"
      >
        <span class="material-symbols-outlined">
          warehouse
        </span>

        <span>
          {{ 'warehouses.list.title' | translate }}
        </span>
      </a>

      <!-- DEVICES -->
      <a
        routerLink="/devices"
        routerLinkActive="app-sidebar__item--active"
        class="app-sidebar__item"
      >
        <span class="material-symbols-outlined">
          sensors
        </span>

        <span>
          {{ 'nav.devices' | translate }}
        </span>
      </a>

      <!-- TEAM -->
      <a
        routerLink="/team"
        routerLinkActive="app-sidebar__item--active"
        class="app-sidebar__item"
      >
        <span class="material-symbols-outlined">
          group
        </span>

        <span>
          {{ 'nav.team' | translate }}
        </span>
      </a>

      <!-- TRACEABILITY -->
      <a
        routerLink="/traceability"
        routerLinkActive="app-sidebar__item--active"
        class="app-sidebar__item"
      >
        <span class="material-symbols-outlined">
          history
        </span>

        <span>
          {{ 'nav.traceability' | translate }}
        </span>
      </a>

      <!-- SUBSCRIPTION -->
      <a
        routerLink="/subscription"
        routerLinkActive="app-sidebar__item--active"
        class="app-sidebar__item"
      >
        <span class="material-symbols-outlined">
          credit_card
        </span>

        <span>
          {{ 'nav.subscription' | translate }}
        </span>
      </a>

    </nav>

    <!-- BOTTOM -->
    <div class="app-sidebar__bottom">

      <!-- LANGUAGE -->
      <app-language-switcher></app-language-switcher>

      <!-- SETTINGS -->
      <button
        type="button"
        class="app-sidebar__item"
      >
        <span class="material-symbols-outlined">
          settings
        </span>

        <span>
          {{ 'nav.settings' | translate }}
        </span>
      </button>

      <!-- SIGN OUT -->
      <button
        type="button"
        class="app-sidebar__logout"
        (click)="signOut()"
      >
        <span class="material-symbols-outlined">
          logout
        </span>

        <span>
          {{ 'nav.signOut' | translate }}
        </span>
      </button>

    </div>

  </aside>

  <main class="app-layout__content">
    <router-outlet></router-outlet>
  </main>

</div>
