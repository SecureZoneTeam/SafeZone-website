<header class="site-header">
  <nav class="navbar" [attr.aria-label]="'a11y.mainNavigation' | translate">
    <a class="navbar-logo" [href]="landingPageUrl" [attr.aria-label]="'a11y.landingPage' | translate">
      <img src="assets/logos/logo-principal.png" alt="NodeSecure" />
    </a>

    <div class="navbar-menu">
      @for (option of options; track option.path) {
        <a
          class="nav-link"
          [routerLink]="option.path"
          routerLinkActive="nav-link--active">
          <mat-icon class="nav-link__icon" aria-hidden="true">{{ option.icon }}</mat-icon>
          <span class="nav-link__label">{{ option.labelKey | translate }}</span>
        </a>
      }
    </div>

    <div class="navbar-actions">
      <app-language-switcher />

      @if (iamStore.isSignedIn()) {
        <button class="navbar-button ns-has-icon" type="button" (click)="signOut()">
          <span class="material-symbols-outlined ns-btn-icon" aria-hidden="true">logout</span>
          {{ 'nav.signOut' | translate }}
        </button>
      } @else {
        <a class="nav-link nav-link--ghost ns-has-icon" routerLink="/sign-in">
          <span class="material-symbols-outlined ns-btn-icon" aria-hidden="true">login</span>
          {{ 'nav.signIn' | translate }}
        </a>
        <a class="navbar-button ns-has-icon" routerLink="/sign-up">
          <span class="material-symbols-outlined ns-btn-icon" aria-hidden="true">person_add</span>
          {{ 'nav.signUp' | translate }}
        </a>
      }
    </div>
  </nav>
</header>
