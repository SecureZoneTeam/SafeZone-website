<header class="site-header">
  <nav class="navbar" aria-label="Main navigation">
    <a class="navbar-logo" [href]="landingPageUrl" aria-label="NodeSecure Landing Page">
      <img src="assets/logos/logo-principal.png" alt="NodeSecure" />
    </a>

    <div class="navbar-menu">
      @for (option of options; track option.path) {
        <a
          class="nav-link"
          [routerLink]="option.path"
          routerLinkActive="nav-link--active">
          <mat-icon class="nav-link__icon" aria-hidden="true">{{ option.icon }}</mat-icon>
          <span class="nav-link__label">{{ option.labelKey | translate }}</span>
        </a>
      }
    </div>

    <div class="navbar-actions">
      <app-language-switcher />

      @if (iamStore.isSignedIn()) {
        <button class="navbar-button" type="button" (click)="signOut()">
          {{ 'nav.signOut' | translate }}
          <span aria-hidden="true">&rarr;</span>
        </button>
      } @else {
        <a class="nav-link nav-link--ghost" routerLink="/sign-in">
          {{ 'nav.signIn' | translate }}
        </a>
        <a class="navbar-button" routerLink="/sign-up">
          {{ 'nav.signUp' | translate }}
          <span aria-hidden="true">&rarr;</span>
        </a>
      }
    </div>
  </nav>
</header>
